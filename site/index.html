<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="今日摘要：每天 09:18、13:18、17:18 聚合 9 个公开信息源，按日期归档。">
<title>热榜日报</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>(function () {
  try {
    var saved = localStorage.getItem("hot-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();</script>
<style>
:root {
  --bg: #fbfbfd;
  --surface: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0, 0, 0, .08);
  --hover: rgba(0, 0, 0, .035);
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, .1);
  --radius: 20px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04);
}
[data-theme="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --text: #f5f5f7;
  --muted: #a1a1a6;
  --line: rgba(255, 255, 255, .1);
  --hover: rgba(255, 255, 255, .06);
  --accent: #2997ff;
  --accent-soft: rgba(41, 151, 255, .14);
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    radial-gradient(42% 42% at 14% 6%, rgba(10, 132, 255, .16), transparent 70%),
    radial-gradient(36% 36% at 86% 14%, rgba(191, 90, 242, .12), transparent 70%),
    radial-gradient(46% 46% at 50% 104%, rgba(255, 159, 10, .10), transparent 70%);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color .3s ease, color .3s ease;
}
[data-theme="dark"] body {
  background-image:
    radial-gradient(42% 42% at 14% 6%, rgba(10, 132, 255, .22), transparent 70%),
    radial-gradient(36% 36% at 86% 14%, rgba(191, 90, 242, .18), transparent 70%),
    radial-gradient(46% 46% at 50% 104%, rgba(255, 159, 10, .12), transparent 70%);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.theme-toggle {
  position: fixed;
  right: 24px;
  top: 24px;
  z-index: 30;
  appearance: none;
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .6);
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, .72), rgba(255, 255, 255, .42));
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  color: var(--text);
  box-shadow:
    0 10px 30px rgba(0, 0, 0, .12),
    inset 0 1px 0 rgba(255, 255, 255, .85);
  cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, background-color .25s ease;
}
[data-theme="dark"] .theme-toggle {
  border-color: rgba(255, 255, 255, .16);
  background: linear-gradient(135deg, rgba(58, 58, 60, .66), rgba(28, 28, 30, .45));
  box-shadow:
    0 10px 30px rgba(0, 0, 0, .5),
    inset 0 1px 0 rgba(255, 255, 255, .18);
}
.theme-toggle:hover {
  transform: scale(1.06);
  border-color: rgba(255, 255, 255, .8);
}
@supports not (backdrop-filter: blur(1px)) {
  .theme-toggle,
  [data-theme="dark"] .theme-toggle { background: var(--surface); }
}
.theme-toggle svg { width: 20px; height: 20px; display: none; }
.theme-toggle .icon-moon { display: block; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
.hero {
  max-width: 1280px;
  margin: 0 auto;
  padding: 84px 28px 34px;
}
.eyebrow {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--accent);
}
.hero h1 {
  margin: 10px 0 0;
  font-size: clamp(34px, 5.4vw, 56px);
  line-height: 1.07;
  letter-spacing: -.02em;
  font-weight: 700;
}
.hero .sub {
  margin: 14px 0 0;
  font-size: 17px;
  line-height: 1.5;
  color: var(--muted);
  letter-spacing: -.01em;
}
.grid {
  max-width: 1280px;
  margin: 0 auto;
  padding: 6px 28px 64px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 26px;
  box-shadow:
    0 12px 40px rgba(0, 0, 0, .08),
    inset 0 1px 0 rgba(255, 255, 255, .9);
  padding: 20px 16px 12px;
  transition: background-color .3s ease, border-color .2s ease;
}
[data-theme="dark"] .card {
  box-shadow:
    0 12px 40px rgba(0, 0, 0, .5),
    inset 0 1px 0 rgba(255, 255, 255, .07);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 10px;
}
.badge {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: color-mix(in srgb, var(--brand) 20%, transparent);
  color: color-mix(in srgb, var(--brand) 88%, var(--text));
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0;
}
[data-theme="dark"] .badge {
  background: color-mix(in srgb, var(--brand) 28%, transparent);
  color: color-mix(in srgb, var(--brand) 78%, #ffffff);
}
.badge.wide { font-size: 10.5px; }
.card-head h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.list a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 8px;
  margin: 0 -8px;
  border-radius: 9px;
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: -.006em;
  text-decoration: none;
  transition: background-color .15s ease;
}
.list a:hover { background: var(--hover); text-decoration: none; }
.list a:hover .title { color: var(--accent); }
.rank {
  flex: none;
  width: 16px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.list li:nth-child(-n+3) .rank { font-weight: 600; }
.list li:nth-child(1) .rank { color: color-mix(in srgb, var(--brand) 82%, var(--text)); }
.list li:nth-child(2) .rank { color: color-mix(in srgb, var(--brand) 64%, var(--text)); }
.list li:nth-child(3) .rank { color: color-mix(in srgb, var(--brand) 46%, var(--text)); }
.title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  transition: color .15s ease;
}
.hot {
  flex: none;
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.empty {
  padding: 22px 8px 18px;
  text-align: center;
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
}
.empty a { color: var(--accent); }
.timeline {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 28px 64px;
}
.month-title {
  margin: 34px 0 12px;
  padding-left: 4px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--muted);
}
.entries {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.entry {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 19px 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  color: var(--text);
  text-decoration: none;
  transition: background-color .2s ease, border-color .2s ease;
}
.entry:hover {
  border-color: rgba(0, 113, 227, .45);
  text-decoration: none;
}
.entry-date { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.entry-date b {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.02em;
}
.entry-date span { font-size: 13px; color: var(--muted); }
.entry-meta {
  margin-left: auto;
  flex: none;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tag {
  flex: none;
  padding: 3px 9px;
  border-radius: 980px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
}
.entry-chevron {
  flex: none;
  font-size: 22px;
  line-height: 1;
  color: var(--muted);
  transition: transform .2s ease, color .2s ease;
}
.entry:hover .entry-chevron { color: var(--accent); transform: translateX(2px); }
.footer {
  max-width: 1280px;
  margin: 0 auto;
  padding: 4px 28px 84px;
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
}
.footer a { color: var(--accent); }
a:focus-visible, .theme-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .theme-toggle { right: 16px; top: 16px; }
  .hero { padding: 64px 20px 26px; }
  .hero .sub { font-size: 15px; }
  .grid { grid-template-columns: 1fr; padding: 4px 20px 44px; gap: 14px; }
  .timeline { padding: 0 20px 44px; }
  .entry { padding: 16px 18px; gap: 12px; }
  .entry-date { flex: 1; }
  .entry-meta { display: none; }
  .footer { padding: 4px 20px 44px; }
  .title {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .hot { font-size: 11px; }
  .list a { align-items: flex-start; }
}
</style>
</head>
<body>
<main>
  <section class="hero">
    <p class="eyebrow">每日更新</p>
    <h1>热榜日报</h1>
    <p class="sub">聚合公开信息源，每天自动生成内容摘要。</p>
  </section>
  <section class="timeline" aria-label="日报目录">
<section class="month"><h2 class="month-title">2026 年 11 月</h2><ol class="entries"><li><a class="entry" href="archive/2026-11-18.html"><span class="entry-date"><b>11月18日</b><span>星期三</span></span><span class="entry-meta">9 个板块 · 90 条</span><span class="tag">最新</span><span class="entry-chevron" aria-hidden="true">›</span></a></li><li><a class="entry" href="archive/2026-11-17.html"><span class="entry-date"><b>11月17日</b><span>星期二</span></span><span class="entry-meta">9 个板块 · 88 条</span><span class="entry-chevron" aria-hidden="true">›</span></a></li></ol></section>
  </section>
</main>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="切换浅色 / 深色模式">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 14.4A8.5 8.5 0 1 1 9.6 3.4a7 7 0 0 0 11 11Z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.6v2.4M12 19v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.6 12h2.4M19 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
</button>
<script>(function () {
  var root = document.documentElement;
  var btn = document.getElementById("themeToggle");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("hot-theme", next); } catch (e) {}
  });

  // 在 IDE 预览等受限 iframe 中，浏览器会拦截新标签页，改为当前框架内跳转
  document.addEventListener("click", function (event) {
    var link = event.target.closest && event.target.closest("a[href^='http']");
    if (!link || window.self === window.top) return;
    event.preventDefault();
    window.location.href = link.href;
  });
})();</script>
</body>
</html>
