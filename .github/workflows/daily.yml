name: Daily hot list

on:
  schedule:
    # 01:00 / 06:00 / 11:00 UTC = 09:00 / 14:00 / 19:00 Asia/Shanghai
    - cron: "0 1,6,11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch hot lists and build page
        run: |
          python scripts/fetch_data.py
          python scripts/build_page.py

      - name: Commit daily snapshot
        run: |
          git config user.name "vme999"
          git config user.email "15908826+vme999@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "chore: daily snapshot $(TZ=Asia/Shanghai date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
