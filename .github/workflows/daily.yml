name: Daily hot list

on:
  schedule:
    # 01:18 / 05:18 / 09:18 UTC
    # = 09:18 / 13:18 / 17:18 Asia/Shanghai
    - cron: "18 1,5,9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch hot lists and build page
        run: |
          python scripts/fetch_data.py
          python scripts/build_page.py

      - name: Commit daily snapshot
        run: |
          git config user.name "vme999"
          git config user.email "15908826+vme999@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "chore: daily snapshot $(TZ=Asia/Shanghai date +%F)"
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
